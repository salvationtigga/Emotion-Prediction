<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moodscope – read the emotion in any sentence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<main>
  <header>
    <span class="pill"><b id="dot"></b><span id="status">Waking up the model…</span></span>
    <h1>How does this sentence feel?</h1>
    <p>Type anything. A BiGRU network reads it and tells you the emotion underneath.</p>
  </header>

  <section class="card" id="card">
    <textarea id="input" maxlength="2000" rows="4" placeholder="I can't believe they remembered my birthday…" aria-label="Sentence to analyze"></textarea>
    <div class="row"><div class="chips" id="chips"></div><span id="count">0 / 2000</span></div>
    <button id="go" type="button"><span class="lbl">Analyze emotion</span><span class="dots"><i></i><i></i><i></i></span></button>
    <p id="err" role="alert"></p>

    <div class="result" id="result" hidden>
      <div class="hero">
        <div class="emoji" id="emoji"></div>
        <div class="who"><small>Detected emotion</small><h2 id="label"></h2></div>
        <div class="gauge">
          <svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="arc" id="arc" cx="60" cy="60" r="52"/></svg>
          <span id="pct">0%</span>
        </div>
      </div>
      <ul id="bars"></ul>
    </div>
  </section>
</main>
<script src="/static/script.js"></script>
</body>
</html>
